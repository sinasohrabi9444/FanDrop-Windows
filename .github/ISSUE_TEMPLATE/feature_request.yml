name: ✨ Feature request
description: Suggest a new blade, file type or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like FanDrop to do?
      placeholder: A "Flip" blade under Ctrl for images.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode would it live in?
      options:
        - Convert (Shift)
        - Tools (Ctrl)
        - Actions (Alt)
        - Not a blade / something else
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
